<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWaste · Account Recovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./../css/login.css">
    <style>
        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .pin-input {
            letter-spacing: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="bg"></div>

    <div class="page">
        <div class="left">
            <div class="brand-logo">
                <div class="brand-name">
                    SmartWaste
                    <span>Jose Dalman · Zamboanga del Norte</span>
                </div>
            </div>
            <h1 class="hero-headline">
                Recover<br>Your<br><em>Account.</em>
            </h1>
            <p class="hero-sub">
                Enter your registered email and we’ll send a 6-digit PIN so you can set a new password.
            </p>
        </div>

        <div class="right">
            <div class="card">

                <!-- STEP 1: Request PIN -->
                <div class="step active" id="step1">
                    <div class="card-title">Forgot password</div>
                    <div class="card-sub">We’ll email you a one-time PIN.</div>

                    <div class="form-group">
                        <label class="form-label">Email address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com"
                            autocomplete="email">
                    </div>

                    <button class="btn" id="sendPinBtn">
                        <span class="btn-text">Send PIN</span>
                        <span class="btn-loader" hidden>
                            <span class="spinner"></span>
                            Sending…
                        </span>
                    </button>
                </div>

                <!-- STEP 2: Enter PIN + new password -->
                <div class="step" id="step2">
                    <div class="card-title">Enter PIN</div>
                    <div class="card-sub">Check your email for the 6-digit code. It expires in 15 minutes.</div>

                    <div class="form-group">
                        <label class="form-label">6-digit PIN</label>
                        <input type="text" id="pin" class="form-input pin-input" maxlength="6" placeholder="••••••"
                            inputmode="numeric">
                    </div>

                    <div class="form-group">
                        <label class="form-label">New password</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" class="form-input" placeholder="Min. 8 characters"
                                autocomplete="new-password">
                            <button type="button" class="toggle-password" onclick="togglePw(this)">Show</button>
                        </div>
                    </div>

                    <button class="btn" id="resetBtn">
                        <span class="btn-text">Update Password</span>
                        <span class="btn-loader" hidden>
                            <span class="spinner"></span>
                            Updating…
                        </span>
                    </button>

                    <button type="button" class="btn btn-secondary" id="resendBtn">Resend PIN</button>
                </div>

                <div class="alert" id="alertBox"></div>

                <div class="card-foot" style="margin-top:20px;">
                    <a href="/login">← Back to sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="./../js/forgot-password.js"></script>
</body>

</html>
