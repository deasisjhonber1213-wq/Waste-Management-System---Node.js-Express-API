<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=5.0">
    <title>Announcements · SmartWaste Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ----- responsive overrides for announcements page ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.5;
        }

        :root {
            --border2: #e9edf2;
            --bg3: #f8fafc;
            --gold-mid: #d4a02b;
            --gold: #c9921e;
            --gold-dim: rgba(201, 146, 30, 0.08);
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --mono: 'SF Mono', 'Menlo', monospace;
            --red: #e74c3c;
            --green: #2ecc71;
            --border: #e9edf2;
            --panel: #ffffff;
            --radius: 12px;
            --bg2: #f1f5f9;
            --ui: 'Inter', sans-serif;
        }

        /* ----- sidebar ----- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border2);
            padding: 20px 16px;
            overflow-y: auto;
            z-index: 1000;
            transform: translateX(0);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border2);
        }

        .sidebar-logo-icon {
            font-size: 1.7rem;
        }

        .sidebar-logo-text {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.3px;
        }

        .sidebar-logo-text span {
            display: block;
            font-weight: 400;
            font-size: 0.7rem;
            color: var(--text2);
            letter-spacing: 0.3px;
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-section-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text2);
            margin: 18px 0 6px 8px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text2);
            text-decoration: none;
            font-size: 0.88rem;
            transition: 0.15s;
            margin-bottom: 2px;
        }

        .nav-item:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-item.active {
            background: #eef2ff;
            color: #4f46e5;
            font-weight: 500;
        }

        .nav-icon {
            font-size: 1.15rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border2);
            padding-top: 16px;
            margin-top: 8px;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-avatar {
            width: 34px;
            height: 34px;
            background: #eef2ff;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .sidebar-user-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .sidebar-user-role {
            font-size: 0.7rem;
            color: var(--text2);
        }

        .sidebar-logout {
            color: var(--text2);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 6px 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }

        .sidebar-logout:hover {
            color: #b91c1c;
        }

        /* ----- topbar ----- */
        .topbar {
            background: #ffffff;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar-left {
            display: flex;
            flex-direction: column;
        }

        .topbar-title {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .topbar-breadcrumb {
            font-size: 0.7rem;
            color: var(--text2);
        }

        .topbar-hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .topbar-hamburger span {
            display: block;
            width: 22px;
            height: 2.5px;
            background: #1e293b;
            border-radius: 10px;
            transition: 0.2s;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ----- main ----- */
        .main {
            margin-left: 260px;
            padding: 28px 28px 40px;
            transition: margin 0.25s ease;
        }

        /* ----- panel ----- */
        .panel {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border2);
            flex-wrap: wrap;
            gap: 8px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 1rem;
        }

        .panel-title-icon {
            font-size: 1.2rem;
        }

        .panel-body {
            padding: 16px 20px 20px;
        }

        .section-gap {
            margin-bottom: 24px;
        }

        /* ----- announcement cards ----- */
        .ann-card {
            background: var(--panel);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.22s;
            display: flex;
            flex-direction: column;
        }

        .ann-card:hover {
            border-color: var(--gold-mid);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .ann-card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            filter: saturate(0.6) brightness(0.65);
        }

        .ann-card-body {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .ann-card-date {
            font-size: 0.68rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .ann-card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .ann-card-msg {
            font-size: 0.82rem;
            color: var(--text2);
            line-height: 1.7;
            flex: 1;
        }

        .ann-card-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ann-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        /* ----- form ----- */
        .form-grid {
            display: grid;
            gap: 14px;
        }

        .form-grid-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-control {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border2);
            font-size: 0.82rem;
            background: #fff;
            outline: none;
            transition: 0.15s;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 146, 30, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--text2);
            transition: 0.15s;
            white-space: nowrap;
            cursor: pointer;
        }

        .btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .btn-gold {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }

        .btn-gold:hover {
            background: #b07d1a;
            border-color: #b07d1a;
            color: white;
        }

        .btn-danger {
            background: #b91c1c;
            color: white;
            border-color: #b91c1c;
        }

        .btn-danger:hover {
            background: #991b1b;
            border-color: #991b1b;
            color: white;
        }

        .btn-sm {
            padding: 2px 12px;
            font-size: 0.7rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-gold {
            background: #fef3c7;
            color: #92400e;
        }

        .empty-state {
            text-align: center;
            padding: 28px 12px;
            color: var(--text2);
        }

        .empty-state-icon {
            font-size: 2.4rem;
            opacity: 0.5;
            margin-bottom: 6px;
        }

        .empty-state-text {
            font-size: 0.85rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
            max-width: 320px;
            width: 100%;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            background: #1e293b;
            color: white;
            font-size: 0.82rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.25s ease;
        }

        .toast.error {
            background: #b91c1c;
        }

        .toast.success {
            background: #065f46;
        }

        .toast.info {
            background: #1e40af;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 820px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            .topbar-hamburger {
                display: flex;
            }

            .main {
                margin-left: 0;
                padding: 16px 16px 28px;
            }

            .topbar {
                padding: 12px 16px;
            }

            .form-grid-3 {
                grid-template-columns: 1fr 1fr;
            }

            .ann-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        @media (max-width: 550px) {
            .topbar-title {
                font-size: 1rem;
            }

            .form-grid-3 {
                grid-template-columns: 1fr;
            }

            .ann-grid {
                grid-template-columns: 1fr;
            }

            .ann-card-img {
                height: 100px;
            }

            .panel-header {
                flex-direction: column;
                align-items: stretch;
            }

            .panel-body {
                padding: 12px 14px 16px;
            }

            .toast-container {
                right: 12px;
                bottom: 12px;
                max-width: 260px;
            }

            .sidebar {
                width: 250px;
                padding: 16px 12px;
            }

            .btn {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
        }

        @media (max-width: 400px) {
            .ann-card-body {
                padding: 14px;
            }

            .ann-card-footer {
                padding: 10px 14px;
            }

            .ann-card-title {
                font-size: 0.85rem;
            }

            .ann-card-msg {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">♻</div>
            <div class="sidebar-logo-text">Jose Dalman WM<span>Admin Panel</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Overview</div>
            <a href="/dashboard" class="nav-item"><span class="nav-icon">⬡</span>Dashboard</a>
            <div class="nav-section-label">Management</div>
            <a href="/users" class="nav-item"><span class="nav-icon">👥</span>Users</a>
            <a href="/trucks" class="nav-item"><span class="nav-icon">🚛</span>Trucks</a>
            <a href="/routes" class="nav-item"><span class="nav-icon">🗺️</span>Routes</a>
            <a href="/schedules" class="nav-item"><span class="nav-icon">📅</span>Schedules</a>
            <div class="nav-section-label">Community</div>
            <a href="/reports" class="nav-item"><span class="nav-icon">⚠️</span>Reports</a>
            <a href="/announcements" class="nav-item active"><span class="nav-icon">📢</span>Announcements</a>
            <div class="nav-section-label">Analytics</div>
            <a href="/analytics" class="nav-item"><span class="nav-icon">📊</span>Analytics</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-avatar">👤</div>
                <div>
                    <div class="sidebar-user-name" id="adminName">Admin</div>
                    <div class="sidebar-user-role">Administrator</div>
                </div>
            </div>
            <a href="/login.html" class="sidebar-logout" style="margin-top:10px;display:flex;">⎋ &nbsp;Logout</a>
        </div>
    </aside>

    <div class="topbar">
        <div style="display:flex;align-items:center;gap:14px;">
            <button class="topbar-hamburger" id="hamburger"><span></span><span></span><span></span></button>
            <div class="topbar-left">
                <div class="topbar-title">Announcements</div>
                <div class="topbar-breadcrumb">Jose Dalman WM / Community / <span>Announcements</span></div>
            </div>
        </div>
        <div class="topbar-right">
            <!-- Removed duplicate "New Announcement" button -->
        </div>
    </div>

    <main class="main">

        <div class="panel reveal section-gap">
            <div class="panel-header">
                <div class="panel-title">
                    <div class="panel-title-icon">✍️</div>Compose Announcement
                </div>
                <button class="btn btn-gold" onclick="createAnnouncement()">Publish →</button>
            </div>
            <div class="panel-body">
                <div class="form-grid form-grid-3">
                    <div class="form-group"><label class="form-label">Title</label><input class="form-control"
                            id="annTitle" placeholder="Announcement title…"></div>
                    <div class="form-group"><label class="form-label">Pickup Date (optional)</label><input
                            class="form-control" type="date" id="annDate"></div>
                    <div class="form-group"><label class="form-label">Image URL (optional)</label><input
                            class="form-control" id="annImg" placeholder="https://…"></div>
                    <div class="form-group" style="grid-column:1/-1"><label class="form-label">Message</label><textarea
                            class="form-control" id="annMsg" placeholder="Write your message to residents…"
                            style="min-height:80px"></textarea></div>
                </div>
            </div>
        </div>

        <div class="panel reveal">
            <div class="panel-header">
                <div class="panel-title">
                    <div class="panel-title-icon">📢</div>Published Announcements
                </div>
                <span class="badge badge-gold" id="annCount">0</span>
            </div>
            <div style="padding:20px">
                <div class="ann-grid" id="annGrid">
                    <div style="text-align:center;padding:28px;color:var(--text2);grid-column:1/-1"><span
                            class="loading-spinner"></span></div>
                </div>
            </div>
        </div>

    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/style.js"></script>
    <script>
        // ---- hamburger toggle ----
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        if (hamburger) {
            hamburger.addEventListener('click', toggleSidebar);
        }
        if (overlay) {
            overlay.addEventListener('click', toggleSidebar);
        }

        document.querySelectorAll('.sidebar-nav .nav-item').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 820) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });
        });

        // ---- API ----
        const API_URL = window.location.origin + '/api';
        console.log('📡 API URL:', API_URL);

        function getToken() {
            return localStorage.getItem('token');
        }

        const API = {
            get: async (endpoint) => {
                return fetch(API_URL + endpoint, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
            },
            post: async (endpoint, data) => {
                return fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify(data)
                });
            },
            del: async (endpoint) => {
                return fetch(API_URL + endpoint, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
            }
        };

        function fmtDate(date) {
            if (!date) return '—';
            const d = new Date(date);
            return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/login.html';
            }
        }
        checkAuth();

        async function loadAnnouncements() {
            try {
                const res = await API.get("/admin/announcements");
                if (!res.ok) throw new Error();
                const data = await res.json();
                document.getElementById("annCount").textContent = data.length;
                const grid = document.getElementById("annGrid");
                if (!data.length) {
                    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📢</div><div class="empty-state-text">No announcements yet. Create one above!</div></div>';
                    return;
                }
                grid.innerHTML = data.map(a => `
            <div class="ann-card">
                ${a.image_url ? `<img class="ann-card-img" src="${a.image_url}" alt="" onerror="this.style.display='none'">` : `<div style="height:8px;background:linear-gradient(90deg,var(--gold),transparent)"></div>`}
                <div class="ann-card-body">
                    <div class="ann-card-date">${fmtDate(a.created_at)} · ${a.admin_name || "Admin"}</div>
                    <div class="ann-card-title">${a.title}</div>
                    <div class="ann-card-msg">${a.message}</div>
                    ${a.pickup_date ? `<div style="margin-top:10px;font-size:0.74rem;color:var(--gold);font-family:var(--mono)">📅 Pickup: ${fmtDate(a.pickup_date)}</div>` : ""}
                </div>
                <div class="ann-card-footer">
                    <span class="badge badge-gold" style="font-size:0.62rem">Published</span>
                    <button class="btn btn-danger btn-sm" onclick="deleteAnn(${a.id})">🗑 Delete</button>
                </div>
            </div>`).join("");
            } catch { showToast("Failed to load announcements", "error"); }
        }

        async function createAnnouncement() {
            const title = document.getElementById("annTitle").value.trim();
            const msg = document.getElementById("annMsg").value.trim();
            const date = document.getElementById("annDate").value;
            const imgUrl = document.getElementById("annImg").value.trim();
            if (!title || !msg) { showToast("Title and message required", "error"); return; }
            try {
                const res = await API.post("/admin/announcements", { title, message: msg, pickup_date: date || null, image_url: imgUrl || null });
                if (!res.ok) throw new Error();
                document.getElementById("annTitle").value = "";
                document.getElementById("annMsg").value = "";
                document.getElementById("annDate").value = "";
                document.getElementById("annImg").value = "";
                showToast("Announcement published!", "success");
                loadAnnouncements();
            } catch { showToast("Failed to create announcement", "error"); }
        }

        async function deleteAnn(id) {
            if (!confirm("Delete this announcement?")) return;
            try {
                const res = await API.del(`/admin/announcements/${id}`);
                if (!res.ok) throw new Error();
                showToast("Deleted", "success");
                loadAnnouncements();
            } catch { showToast("Delete failed", "error"); }
        }

        async function loadAdminProfile() {
            try {
                const res = await API.get("/admin/profile");
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("adminName").textContent = data.name || "Admin";
                }
            } catch { }
        }

        loadAdminProfile();
        loadAnnouncements();
    </script>
</body>

</html>
