<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f855a">
    <title>You're offline · SmartWaste</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f7fb; color: #1e293b; }
        main { max-width: 28rem; padding: 2rem; text-align: center; }
        h1 { margin-bottom: .5rem; }
        p { line-height: 1.6; }
        a { color: #246b49; }
        @media (prefers-color-scheme: dark) {
            body { background: #0d0f12; color: #e8ecf2; }
            a { color: #6ee7a8; }
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>SmartWaste needs an internet connection to load your account and the latest collection information.</p>
        <p>Your private dashboard and live data are not stored for offline use.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
